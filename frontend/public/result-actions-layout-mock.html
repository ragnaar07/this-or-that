<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYNQ Result Actions Layout Mock</title>
    <style>
      :root {
        --color-bg: #fff176;
        --color-card: #fffde7;
        --color-text: #1a0030;
        --color-text-muted: #5e4080;
        --color-pink: #ec4899;
        --color-pink-dark: #a00060;
        --color-violet: #7c3aed;
        --color-violet-dark: #3d1070;
        --color-border: rgba(26, 0, 48, 0.18);
        --radius-sm: 10px;
        --radius-md: 18px;
        --radius-lg: 28px;
        --radius-full: 9999px;
        --shadow-card: 0 4px 0 rgba(26, 0, 48, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: Outfit, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .mock-shell {
        width: min(100%, 430px);
      }

      .result-actions-card {
        width: 100%;
        min-height: min(680px, calc(100dvh - 48px));
        display: flex;
        flex-direction: column;
        gap: 18px;
        justify-content: space-between;
        padding: 26px 18px 20px;
        background: var(--color-card);
        border: 3px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
      }

      .actions-top {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
      }

      .actions-kicker {
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0;
        color: var(--color-violet);
      }

      .actions-title {
        margin: 0;
        font-size: 2rem;
        line-height: 0.96;
        font-weight: 900;
        color: var(--color-text);
      }

      .actions-subtitle {
        max-width: 30ch;
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.35;
        font-weight: 700;
        color: var(--color-text-muted);
      }

      .primary-share-btn {
        width: 100%;
        min-height: 68px;
        border: 0;
        border-radius: var(--radius-md);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 18px 20px;
        background: linear-gradient(135deg, var(--color-pink), var(--color-violet));
        box-shadow: 0 8px 0 var(--color-violet-dark);
        color: white;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 900;
        cursor: pointer;
      }

      .primary-share-btn span:first-child {
        font-size: 1.35rem;
      }

      .utility-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .utility-btn {
        min-height: 82px;
        border: 2px solid var(--color-border);
        border-radius: var(--radius-sm);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 10px 8px;
        background: white;
        box-shadow: 0 4px 0 rgba(26, 0, 48, 0.12);
        color: var(--color-text);
        font: inherit;
        cursor: pointer;
      }

      .utility-btn__icon {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        background: #ffe4f3;
        color: var(--color-pink);
        font-size: 1.15rem;
      }

      .utility-btn--whatsapp .utility-btn__icon {
        background: #dcfce7;
        color: #128c7e;
      }

      .utility-btn--download .utility-btn__icon {
        background: #ede9fe;
        color: var(--color-violet);
      }

      .utility-btn__label {
        font-size: 0.74rem;
        line-height: 1.05;
        font-weight: 900;
      }

      .copy-link {
        width: fit-content;
        margin: 0 auto;
        border: 0;
        background: transparent;
        color: var(--color-text-muted);
        font: inherit;
        font-size: 0.82rem;
        font-weight: 800;
        text-decoration: underline;
        text-underline-offset: 4px;
        cursor: pointer;
      }

      .bottom-actions {
        margin-top: auto;
        padding-top: 16px;
        border-top: 2px dashed rgba(26, 0, 48, 0.14);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .secondary-action {
        min-height: 50px;
        border: 2px solid var(--color-border);
        border-radius: var(--radius-md);
        background: #ffffff;
        color: var(--color-text);
        font: inherit;
        font-size: 0.86rem;
        font-weight: 900;
        cursor: pointer;
      }

      .secondary-action--play {
        background: #ffe4f3;
        color: var(--color-pink-dark);
      }

      @media (max-width: 360px) {
        .result-actions-card {
          padding: 22px 14px 16px;
        }

        .actions-title {
          font-size: 1.72rem;
        }

        .utility-row {
          gap: 8px;
        }

        .utility-btn__label {
          font-size: 0.68rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="mock-shell">
      <section class="result-actions-card" aria-label="Result sharing actions mock">
        <div class="actions-top">
          <div class="actions-kicker">FINAL CARD</div>
          <h1 class="actions-title">Share your result</h1>
          <p class="actions-subtitle">Turn this match into a card people can react to, save, and send.</p>
        </div>

        <button class="primary-share-btn" type="button">
          <span aria-hidden="true">📸</span>
          <span>SHARE RESULT CARD</span>
        </button>

        <div class="utility-row" aria-label="Secondary result actions">
          <button class="utility-btn" type="button">
            <span class="utility-btn__icon" aria-hidden="true">🎯</span>
            <span class="utility-btn__label">Challenge<br />Friend</span>
          </button>
          <button class="utility-btn utility-btn--whatsapp" type="button">
            <span class="utility-btn__icon" aria-hidden="true">💬</span>
            <span class="utility-btn__label">WhatsApp</span>
          </button>
          <button class="utility-btn utility-btn--download" type="button">
            <span class="utility-btn__icon" aria-hidden="true">⬇</span>
            <span class="utility-btn__label">Download<br />PNG</span>
          </button>
        </div>

        <button class="copy-link" type="button">Copy result text</button>

        <div class="bottom-actions" aria-label="Lower emphasis navigation actions">
          <button class="secondary-action secondary-action--play" type="button">Play Again</button>
          <button class="secondary-action" type="button">Go Home</button>
        </div>
      </section>
    </main>
  </body>
</html>
